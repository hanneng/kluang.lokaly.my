# Apache reverse-proxy vhost for the Lokaly app.
#
# This is the HTTP (:80) vhost only. Do NOT hand-write the HTTPS vhost —
# `certbot --apache` reads this file and generates a matching kluang-le-ssl.conf
# on :443, and appends the HTTP->HTTPS redirect below. See deploy/README.md.
#
# Multi-tenancy note: the app resolves the town from the Host header, so one
# vhost can serve several town domains. Add each as a ServerAlias and the same
# Node process handles them all — no per-town Apache config, no per-town process.

<VirtualHost *:80>
    ServerName kluang.lokaly.my
    # Add ServerAlias lines here for any additional domains/aliases pointed at
    # this box, e.g.:
    #   ServerAlias www.kluang.lokaly.my
    #   ServerAlias muar.lokaly.my

    # ProxyPreserveHost is load-bearing: the app's town resolution reads the
    # original Host header, so it must survive the proxy hop.
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/kluang-error.log
    CustomLog ${APACHE_LOG_DIR}/kluang-access.log combined

    # --- Appended by `certbot --apache` on first run: ---
    # RewriteEngine on
    # RewriteCond %{SERVER_NAME} =kluang.lokaly.my
    # RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
